[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-thesis"
version = "0.1.0"
description = "学位论文全流程智能体工作台"
readme = { text = "学位论文全流程智能体后端。", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [{ name = "Deep Thesis contributors" }]
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "application*", "artifacts*", "common*", "db*", "evidence*", "executor*",
  "fsm*", "guardrail*", "hitl*", "jobs*", "knowledge*", "prompts*",
  "research*", "security*", "thesis_docx*", "wanfang*", "writing*",
]

[tool.setuptools.package-data]
prompts = ["*.md"]
thesis_docx = ["templates/*.docx"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-runtime.txt"] }

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
