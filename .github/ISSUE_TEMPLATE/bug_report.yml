name: 缺陷报告
description: 报告可复现的功能、交互或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿上传真实API密钥、未公开论文、个人信息或受限制数据。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 创建任务……
        2. 执行环节……
        3. 看到错误……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或提交哈希
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 十环工作流
        - 文献与知识库
        - 实验与结果账本
        - 正文生成与润色
        - 引用与DOCX
        - 前端交互
        - 安全与权限
        - 安装或部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
      description: 只提供定位所需的最少信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有Issues，未发现相同问题。
          required: true
        - label: 我已移除密钥、个人信息和未公开研究材料。
          required: true
